<!doctype html>
<html><head><meta charset="utf-8"><title>frames</title>
<style>body{margin:0;background:#101418;color:#ddd;font:12px monospace}canvas{image-rendering:pixelated;display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
const p = new URLSearchParams(location.search);
const sheet = p.get('sheet') || 'town';
const scale = Number(p.get('scale') || 6);
const from = Number(p.get('from') || 0);
const to = Number(p.get('to') || 100000);
const img = new Image();
img.onload = () => {
  const cols = img.width / 16, rows = img.height / 16;
  const picked = [];
  for (let i = 0; i < cols * rows; i++) if (i >= from && i <= to) picked.push(i);
  const perRow = Math.min(picked.length, 12);
  const c = document.getElementById('c');
  c.width = perRow * 16 * scale;
  c.height = Math.ceil(picked.length / perRow) * (16 * scale + 14);
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#101418'; ctx.fillRect(0, 0, c.width, c.height);
  picked.forEach((index, slot) => {
    const col = slot % perRow, row = Math.floor(slot / perRow);
    const x = col * 16 * scale, y = row * (16 * scale + 14);
    const sx = (index % cols) * 16, sy = Math.floor(index / cols) * 16;
    ctx.drawImage(img, sx, sy, 16, 16, x, y, 16 * scale, 16 * scale);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.strokeRect(x + 0.5, y + 0.5, 16 * scale, 16 * scale);
    ctx.fillStyle = '#ffe08a'; ctx.font = '12px monospace';
    ctx.fillText(String(index), x + 2, y + 16 * scale + 12);
  });
};
img.src = '/AI_LBS/assets/tiles/' + sheet + '.png';
</script></body></html>
